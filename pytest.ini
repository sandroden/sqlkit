[pytest]
testpaths = test
# The legacy harnesses keep their own runners and must not be collected by
# pytest: regress_porting_traps has run_all.py, doctest has runtests.py.
norecursedirs = test/regress_porting_traps test/doctest .venv .git dist build
markers =
    gtk: tests that instantiate GTK3 widgets (run under xvfb-run -a)
filterwarnings =
    ignore::DeprecationWarning
